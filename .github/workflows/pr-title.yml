name: PR title

# The PR title becomes the squash commit on main, so it follows Conventional Commits too.
# It runs on `pull_request`, not `pull_request_target`: it only reads the title, which the
# read-only token can do, and GitHub blocks `pull_request_target` on public repos by default.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: The subject starts lower-case and has no trailing full stop.
