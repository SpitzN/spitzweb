name: Preview

# Preview deployments are made here, not by Vercel's Git integration (ADR 0017). The preview's
# Neon branch has to exist before the Vercel build migrates it, so this workflow creates the
# branch first and then deploys with the Vercel CLI. apps/site/vercel.json turns Vercel's own
# Git deployments off for every branch except main.
on:
  # pull_request, never pull_request_target: a fork's code must not run with these secrets.
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Naming the shell turns on pipefail, so a failed command in a pipe fails the step.
    shell: bash

env:
  # The Neon integration's naming, so a branch it made earlier is reused.
  NEON_BRANCH: preview/${{ github.head_ref }}
  # Pinned. Renovate reads the next line to keep it current (customManagers:githubActionsVersions).
  # renovate: datasource=npm depName=vercel
  VERCEL_CLI_VERSION: 65.14.0

jobs:
  # The rule turbo-ignore applies to main's deploys: build only when the site, or a package it
  # depends on, changed. This job installs and runs the PR's own dependencies, so it holds no
  # secrets; the jobs that do hold them run none of the PR's code.
  affected:
    # A fork's PR gets no secrets, so it gets no preview.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.check.outputs.site }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check whether the PR affects the site
        id: check
        run: |
          packages=$(pnpm exec turbo run build --affected --dry=json | jq --compact-output '.packages')
          if jq --exit-status 'index("site")' <<<"$packages" >/dev/null; then
            echo "site=true" >>"$GITHUB_OUTPUT"
            echo "This PR affects the site (affected packages: $packages). Deploying a preview."
          else
            echo "site=false" >>"$GITHUB_OUTPUT"
            echo "No preview: this PR doesn't affect the site (affected packages: $packages)." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: affected
    if: needs.affected.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The schema diff and the preview URL are PR comments.
      pull-requests: write
    steps:
      # The PR's head, which is what Vercel's Git deployments built, not GitHub's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Returns the existing branch when there is one (created: false).
      - name: Create the preview's Neon branch
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          parent_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}

      # The action also outputs the URLs, but GitHub prints a step's inputs before the step can
      # mask them, and the host would show. Read here, they are masked before anything sees them.
      - name: Read the branch's connection strings
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CONNECTION_URI: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/connection_uri
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
          CREATED: ${{ steps.branch.outputs.created }}
        run: |
          read_url() {
            curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $NEON_API_KEY" \
              --data-urlencode "branch_id=$BRANCH_ID" \
              --data-urlencode "database_name=neondb" \
              --data-urlencode "role_name=neondb_owner" \
              --data-urlencode "pooled=$1" "$CONNECTION_URI" |
              jq --exit-status --raw-output '.uri'
          }
          db_url=$(read_url false)
          db_url_pooled=$(read_url true)
          echo "::add-mask::$db_url"
          echo "::add-mask::$db_url_pooled"
          {
            echo "db_url=$db_url"
            echo "db_url_pooled=$db_url_pooled"
          } >>"$GITHUB_OUTPUT"
          echo "Neon branch $NEON_BRANCH (created: $CREATED)."

      # A remote build: Vercel runs vercel.json's `pnpm db:migrate && pnpm build`, so the
      # migration runs against the branch above (ADR 0009). The rest of the preview's env comes
      # from Vercel's Preview environment.
      - name: Deploy the preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DB_URL: ${{ steps.neon.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          output=$(pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --environment preview --yes \
            --build-env "DATABASE_URL_UNPOOLED=$DB_URL" \
            --env "DATABASE_URL=$DB_URL_POOLED" \
            --env "DATABASE_URL_UNPOOLED=$DB_URL")
          # The CLI prints the deployment's URL on stdout, last.
          url=$(tail -n 1 <<<"$output")
          if [[ ! $url =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::vercel deploy didn't end with a deployment URL."
            exit 1
          fi
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Comment the schema diff against production
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1.0.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: ${{ env.NEON_BRANCH }}
          base_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}

      # One comment per PR: this workflow's own, found by its marker and updated on each push.
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- spitzweb-preview -->'
          body="$marker
          **Preview:** $PREVIEW_URL

          Built from ${HEAD_SHA::7}, on its own Neon branch \`$NEON_BRANCH\`."
          comment_ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          comment_id=$(head -n 1 <<<"$comment_ids")
          if [[ -n $comment_id ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field body="$body" --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field body="$body" --silent
          fi
          echo "$body" >>"$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PR that never affected the site has no branch, and that isn't a failure. The name
      # always starts with preview/, so this can't reach production or development.
      - name: Delete the preview's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCHES: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches
        run: |
          branches=$(curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --data-urlencode "search=$NEON_BRANCH" "$BRANCHES")
          branch_id=$(jq --raw-output --arg name "$NEON_BRANCH" \
            '.branches[] | select(.name == $name) | .id' <<<"$branches")
          if [[ -z $branch_id ]]; then
            echo "No Neon branch named $NEON_BRANCH, so there is nothing to delete."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --output /dev/null --request DELETE \
            --header "Authorization: Bearer $NEON_API_KEY" "$BRANCHES/$branch_id"
          echo "Deleted the Neon branch $NEON_BRANCH ($branch_id)."
