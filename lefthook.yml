# Commit: fast and local to the change. Push: the whole gate (docs/conventions.md, The gate).
pre-commit:
  commands:
    format:
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,mdx,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm check
